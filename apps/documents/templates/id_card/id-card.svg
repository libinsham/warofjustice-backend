<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="60mm" viewBox="0 0 180 60">
  <defs>
    <linearGradient id="frontBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071A33"/>
      <stop offset="65%" stop-color="#0B315A"/>
      <stop offset="100%" stop-color="#0E5C86"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36B7D8"/>
      <stop offset="100%" stop-color="#7BE0F2"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D9E5EF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B8C9D8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0.8" dy="1.2" stdDeviation="1.2" flood-opacity="0.25"/>
    </filter>
    <clipPath id="frontClip"><rect x="2" y="3" width="85.6" height="54" rx="3"/></clipPath>
    <clipPath id="backClip"><rect x="92.4" y="3" width="85.6" height="54" rx="3"/></clipPath>
  </defs>

  <!-- FRONT -->
  <g filter="url(#shadow)">
    <rect x="2" y="3" width="85.6" height="54" rx="3" fill="url(#frontBg)"/>
    <g clip-path="url(#frontClip)">
      <circle cx="83" cy="8" r="22" fill="#123F68" opacity=".55"/>
      <circle cx="75" cy="55" r="27" fill="#0A789A" opacity=".22"/>
      <path d="M58 3 L88 3 L88 35 Q73 27 58 3Z" fill="#FFFFFF" opacity=".035"/>
      <path d="M57 57 C65 39 76 34 91 34 L91 57Z" fill="url(#accent)" opacity=".14"/>
    </g>

    <!-- Logo / organization -->
    <circle cx="9.5" cy="10" r="4.2" fill="none" stroke="#79DDF0" stroke-width=".7"/>
    <path d="M7.2 10.1 L9 11.9 L12.1 8.6" fill="none" stroke="#FFFFFF" stroke-width=".85" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="16" y="9.2" font-family="Arial, Helvetica, sans-serif" font-size="3.25" font-weight="700" fill="#FFFFFF" letter-spacing=".45">WAR OF JUSTICE</text>
    <text x="16" y="12.3" font-family="Arial, Helvetica, sans-serif" font-size="1.55" fill="#9EDAE8" letter-spacing=".65">MEDIA • JUSTICE • HUMANITY</text>

    <!-- Photo -->
    <rect x="7" y="18" width="19" height="25" rx="2.2" fill="#EAF2F7"/>
    <circle cx="16.5" cy="25.2" r="4.1" fill="#B8CAD8"/>
    <path d="M10.5 39.5 Q16.5 32 22.5 39.5Z" fill="#B8CAD8"/>
    <rect x="7" y="18" width="19" height="25" rx="2.2" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width=".5"/>

    <!-- Identity -->
    <text x="30" y="20.8" font-family="Arial, Helvetica, sans-serif" font-size="1.65" fill="#8EB5C9" letter-spacing=".5">MEMBERSHIP ID</text>
    <text x="30" y="25.3" font-family="Arial, Helvetica, sans-serif" font-size="4.2" font-weight="700" fill="#FFFFFF">WOJ-2026-00003</text>

    <text x="30" y="30.2" font-family="Arial, Helvetica, sans-serif" font-size="1.65" fill="#8EB5C9">MEMBER</text>
    <text x="30" y="34" font-family="Arial, Helvetica, sans-serif" font-size="2.75" font-weight="700" fill="#FFFFFF">WARRIOR JUSTICE26</text>

    <text x="30" y="39" font-family="Arial, Helvetica, sans-serif" font-size="1.65" fill="#8EB5C9">MEMBERSHIP</text>
    <text x="30" y="42.5" font-family="Arial, Helvetica, sans-serif" font-size="2.4" font-weight="600" fill="#FFFFFF">GOLD ELITE • MONTHLY</text>

    <!-- Active pill -->
    <rect x="68.5" y="45" width="12.5" height="5" rx="2.5" fill="#31C48D"/>
    <circle cx="71.3" cy="47.5" r="1" fill="#FFFFFF"/>
    <text x="73" y="48.4" font-family="Arial, Helvetica, sans-serif" font-size="1.65" font-weight="700" fill="#FFFFFF">ACTIVE</text>

    <text x="7" y="51.5" font-family="Arial, Helvetica, sans-serif" font-size="1.45" fill="#9CC7D8">VALID THROUGH</text>
    <text x="20.5" y="51.5" font-family="Arial, Helvetica, sans-serif" font-size="1.65" font-weight="700" fill="#FFFFFF">31 DEC 2026</text>
  </g>

  <!-- BACK -->
  <g filter="url(#shadow)">
    <rect x="92.4" y="3" width="85.6" height="54" rx="3" fill="#F7FAFC"/>
    <rect x="92.4" y="3" width="85.6" height="10" rx="3" fill="#071A33"/>
    <rect x="92.4" y="10" width="85.6" height="3" fill="#0B315A"/>
    <text x="97" y="9.6" font-family="Arial, Helvetica, sans-serif" font-size="2.65" font-weight="700" fill="#FFFFFF" letter-spacing=".45">ACCOUNT &amp; CONTACT INFORMATION</text>

    <!-- Credential block -->
    <text x="97" y="18.5" font-family="Arial, Helvetica, sans-serif" font-size="1.55" font-weight="700" fill="#6B7D8D" letter-spacing=".35">ACCOUNT CREDENTIALS</text>
    <text x="97" y="22.5" font-family="Arial, Helvetica, sans-serif" font-size="1.5" fill="#718392">EMAIL</text>
    <text x="109" y="22.5" font-family="Arial, Helvetica, sans-serif" font-size="2" fill="#152A3C">user.warrior26@email.com</text>

    <text x="97" y="27.2" font-family="Arial, Helvetica, sans-serif" font-size="1.5" fill="#718392">STATUS</text>
    <text x="109" y="27.2" font-family="Arial, Helvetica, sans-serif" font-size="2" font-weight="600" fill="#152A3C">Verified</text>
    <circle cx="126.5" cy="26.55" r="1.3" fill="#2DBB7F"/>
    <path d="M125.8 26.55 L126.35 27.15 L127.3 26.05" fill="none" stroke="#FFF" stroke-width=".45"/>

    <line x1="97" y1="30" x2="173.5" y2="30" stroke="#D9E2E8" stroke-width=".45"/>

    <!-- Contact -->
    <text x="97" y="34.7" font-family="Arial, Helvetica, sans-serif" font-size="1.55" font-weight="700" fill="#6B7D8D" letter-spacing=".35">CONTACT INFORMATION</text>
    <text x="97" y="39" font-family="Arial, Helvetica, sans-serif" font-size="1.5" fill="#718392">SUPPORT</text>
    <text x="109" y="39" font-family="Arial, Helvetica, sans-serif" font-size="2" fill="#0C567B">support@warofjustice.com</text>

    <text x="97" y="43.8" font-family="Arial, Helvetica, sans-serif" font-size="1.5" fill="#718392">PHONE</text>
    <text x="109" y="43.8" font-family="Arial, Helvetica, sans-serif" font-size="2" fill="#152A3C">+1 (800) 555-0199</text>

    <text x="97" y="48.5" font-family="Arial, Helvetica, sans-serif" font-size="1.5" fill="#718392">BILLING</text>
    <text x="109" y="48.5" font-family="Arial, Helvetica, sans-serif" font-size="2" fill="#152A3C">billing@warofjustice.com</text>

    <!-- Verification QR placeholder -->
    <rect x="160.8" y="17.2" width="12.3" height="12.3" rx="1" fill="#FFFFFF" stroke="#C8D6DF" stroke-width=".5"/>
    <g fill="#071A33">
      <rect x="162" y="18.4" width="3.3" height="3.3"/><rect x="162.7" y="19.1" width="1.9" height="1.9" fill="#FFF"/>
      <rect x="168.6" y="18.4" width="3.3" height="3.3"/><rect x="169.3" y="19.1" width="1.9" height="1.9" fill="#FFF"/>
      <rect x="162" y="24.9" width="3.3" height="3.3"/><rect x="162.7" y="25.6" width="1.9" height="1.9" fill="#FFF"/>
      <rect x="167" y="23.1" width="1.3" height="1.3"/><rect x="169" y="24" width="1.3" height="1.3"/>
      <rect x="170.7" y="22.6" width="1.3" height="1.3"/><rect x="168.2" y="26" width="1.3" height="1.3"/>
    </g>
    <text x="167" y="31.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="1.2" fill="#718392">VERIFY</text>

    <rect x="97" y="51.2" width="76.5" height="3.3" rx="1.65" fill="#EAF1F5"/>
    <text x="135.25" y="53.45" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="1.35" fill="#567080" letter-spacing=".2">PROPERTY OF WAR OF JUSTICE • IF FOUND, PLEASE CONTACT SUPPORT</text>
  </g>

  <!-- Cutline / labels -->
  <text x="2" y="59.2" font-family="Arial, Helvetica, sans-serif" font-size="1.4" fill="#8A98A4">FRONT — CR80 85.6 × 54 mm</text>
  <text x="92.4" y="59.2" font-family="Arial, Helvetica, sans-serif" font-size="1.4" fill="#8A98A4">BACK — CR80 85.6 × 54 mm</text>
</svg>